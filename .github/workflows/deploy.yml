name: Deploy to songgame.de

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_schema:
        description: 'Reset the database from src/schema.sql even if it did not change (DESTRUCTIVE)'
        type: boolean
        default: false

# Two deploys writing over FTP at the same time would trip over each other.
concurrency:
  group: deploy-songgame
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://songgame.de' }}
  FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # Full history so the schema diff below can reach the previous commit.
          fetch-depth: 0

      - name: Verify required secrets are configured
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Only lengths and yes/no flags are printed. The secrets themselves are
          # masked by Actions, but a *derived* string would not be, so nothing
          # below ever echoes a transformed copy of a value.
          missing=()
          dirty=()
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD DB_HOST DB_NAME DB_USER DB_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing+=("$name")
              continue
            fi
            # Leading/trailing only — a password may legitimately contain a space.
            case "$value" in
              [[:space:]]*|*[[:space:]]) dirty+=("$name") ;;
            esac
            echo "$name length=${#value}"
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} - see README.md, section Deployment."
            exit 1
          fi

          # A trailing newline picked up while copy-pasting is the usual reason
          # for an FTP '530 Login incorrect' against credentials that are
          # otherwise correct, and it is invisible in the Actions UI.
          if [ ${#dirty[@]} -gt 0 ]; then
            echo "::error::These secrets contain whitespace: ${dirty[*]}. Re-enter them without a trailing newline or space."
            exit 1
          fi

      - name: Lint PHP sources
        run: |
          set -euo pipefail
          php --version
          find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Did src/schema.sql change?
        id: schema
        env:
          FORCE_SCHEMA: ${{ inputs.force_schema }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed=false
          if [ "${FORCE_SCHEMA:-false}" = "true" ]; then
            changed=true
            echo "Forced via workflow_dispatch."
          elif [ "$EVENT_NAME" = "push" ]; then
            # All-zero SHA (branch just created) or an unreachable base after a
            # force push: assume changed rather than silently skipping a reset.
            if [ -z "${BEFORE_SHA:-}" ] \
               || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              changed=true
              echo "No usable base commit - assuming schema.sql changed."
            elif git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -qx 'src/schema.sql'; then
              changed=true
              echo "src/schema.sql changed in ${BEFORE_SHA}..${AFTER_SHA}."
            else
              echo "src/schema.sql unchanged - the database will be left alone."
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Write src/config.local.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # var_export does the escaping, so a password containing quotes or
          # backslashes cannot break out of the array into executable PHP.
          php -r '
            $keys = ["DB_HOST","DB_USER","DB_PASS","DB_NAME","YT_API_KEY","YT_CLIENT_ID","YT_CLIENT_SECRET"];
            $out = [];
            foreach ($keys as $k) {
                $v = getenv($k);
                $out[$k] = $v === false ? "" : $v;
            }
            file_put_contents("src/config.local.php",
                "<?php\n// Generated by .github/workflows/deploy.yml - do not edit by hand.\nreturn "
                . var_export($out, true) . ";\n");
          '
          php -l src/config.local.php

      - name: Set up lftp
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Every lftp call in this job reads these. Written once here because
          # steps do not share shell state, only the filesystem.
          #
          # The two settings that matter are not defaults:
          #   dns:order inet      - all-inkl publishes an AAAA record, and an
          #                         IPv6 control connection makes the client ask
          #                         for an EPSV data channel that the runner then
          #                         cannot reach (ECONNRESET on the data socket).
          #   ftp:ssl-force       - "ftps://" in lftp means *implicit* TLS on
          #                         port 990. All-inkl speaks *explicit* FTPS, so
          #                         the URL stays ftp:// and TLS is forced here.
          # Not `[ ... ] && ssl_force=false` — under `set -e` a false test there
          # is the last command in the list and would abort the step.
          ssl_force=true
          if [ "${FTP_PROTOCOL}" = "ftp" ]; then
            ssl_force=false
          fi

          cat > "$HOME/.lftprc" <<RC
          set dns:order "inet"
          set ftp:prefer-epsv false
          set ftp:passive-mode true
          set ftp:ssl-force ${ssl_force}
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 20
          set net:reconnect-interval-base 5
          set xfer:clobber true
          set cmd:fail-exit true
          RC
          echo "lftp settings:"
          cat "$HOME/.lftprc"

      - name: Mirror src/ to the webspace
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # "/" strips to "", which is the right prefix for building a path but
          # not a directory lftp can cd into — hence the two forms.
          remote_dir="${REMOTE_DIR%/}"
          put_dir="${remote_dir:-/}"

          # Built up piecewise so the quoting stays readable. The single quotes
          # survive into lftp, which does its own quote parsing, so bash never
          # glob-expands the patterns here.
          cmd="mirror --reverse --delete --verbose --no-perms"
          cmd="$cmd --exclude-glob app.log"
          cmd="$cmd --exclude-glob '_sg-apply-schema-*.php'"
          cmd="$cmd --exclude-glob '.ftp-deploy-sync-state.json'"
          cmd="$cmd --exclude '^\.well-known/'"
          cmd="$cmd ./src/ '$put_dir'"

          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://${FTP_HOST}" -e "$cmd; bye"

      - name: Apply src/schema.sql via a one-shot script
        if: steps.schema.outputs.changed == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Hex only, so it is safe as a sed replacement and as a header value.
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          name="_sg-apply-schema-$(openssl rand -hex 8).php"
          expires=$(( $(date +%s) + 600 ))   # the script refuses after 10 min

          sed -e "s|@TOKEN@|${token}|" -e "s|@EXPIRES@|${expires}|" \
            .github/scripts/apply-schema.php.tpl > "$name"
          php -l "$name" > /dev/null

          remote_dir="${REMOTE_DIR%/}"
          put_dir="${remote_dir:-/}"
          remote_file="${remote_dir}/${name}"

          lftp_run() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://${FTP_HOST}" -e "$1; bye"
          }

          # Guarantee removal even if the HTTP call below fails or the job is
          # cancelled mid-step. The always() step after this is the second net.
          cleanup() {
            echo "Removing ${remote_file} from the server..."
            lftp_run "rm -f \"${remote_file}\"" \
              || echo "::warning::Could not delete ${remote_file} over FTP - remove it manually."
          }
          trap cleanup EXIT

          lftp_run "put -O \"${put_dir}\" \"${name}\""

          echo "Calling ${SITE_URL}/${name} ..."
          status=$(curl --silent --show-error --location --max-time 120 \
            --write-out '%{http_code}' --output /tmp/schema-out.txt \
            --header "X-Deploy-Token: ${token}" \
            "${SITE_URL}/${name}" || echo 000)
          cat /tmp/schema-out.txt || true

          if [ "$status" != "200" ] || ! grep -q SCHEMA_APPLIED /tmp/schema-out.txt; then
            echo "::error::Schema reset failed (HTTP $status)."
            exit 1
          fi
          echo "::notice::Database reset from src/schema.sql."

      - name: Sweep up any leftover one-shot script
        if: always() && steps.schema.outputs.changed == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          remote_dir="${REMOTE_DIR%/}"
          leftovers=$(lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://${FTP_HOST}" \
            -e "cls -1 \"${remote_dir}/_sg-apply-schema-*.php\"; bye" 2>/dev/null || true)
          if [ -n "$leftovers" ]; then
            echo "::warning::Removing leftover one-shot script(s): $leftovers"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://${FTP_HOST}" \
                -e "rm -f \"$f\"; bye" || true
            done <<< "$leftovers"
          else
            echo "Nothing left behind."
          fi
